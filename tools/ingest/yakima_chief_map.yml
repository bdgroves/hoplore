# HopLore slug  ->  YCR's brand-page name at
# https://yakimachiefranches.com/create/brands/<name>
#
# `false` means YCR does not carry that variety, so the script skips it
# without a pointless 404.
#
# Run `--discover` to list every brand page in their sitemap. Unlike the
# Hopsteiner map, this one can be filled in from a real listing rather than
# guessed -- YCR's sitemap enumerates the brand pages.

# from their sitemap, matched to records we already have
citra: citra
mosaic: mosaic
simcoe: simcoe
idaho-7: idaho7
ekuanot: ekuanot
loral: loral
sabro: sabro
palisade: palisade
warrior: warrior

# Listed by YCR, brand page exists, but it carries no Field Notes table at
# all -- checked 2026-09: zero <table> elements, the word "alpha" does not
# appear anywhere in the page text. Not a parser gap. Left mapped so
# --discover doesn't keep flagging it as unmapped; the scraper reports "no
# recognised brewing values" and moves on, which is the honest outcome.
talus: talus

