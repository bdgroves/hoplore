# Breweries whose own beer pages list their hops. snapshot.py --breweries
# saves every beer page into raw/pages/<host>/; beers.py parses them.
#
#   sitemaps / listing: where the beer URLs come from
#   match:              regex a URL must match to count as a beer page
#   render: true        page content is drawn by JavaScript; saved with a
#                       headless browser instead of a plain request

- slug: fort-george
  name: Fort George Brewery
  city: Astoria
  state: OR
  url: https://fortgeorgebrewery.com/
  listing: ['https://fortgeorgebrewery.com/beer/']
  match: '^https://fortgeorgebrewery\.com/beer/[a-z0-9-]+/$'

- slug: double-mountain
  name: Double Mountain Brewery
  city: Hood River
  state: OR
  url: https://doublemountainbrewery.com/
  sitemaps: ['https://doublemountainbrewery.com/sitemap.xml']
  match: '^https://doublemountainbrewery\.com/beer/[a-z0-9_-]+/$'

- slug: pfriem
  name: pFriem Family Brewers
  city: Hood River
  state: OR
  url: https://www.pfriembeer.com/
  listing: ['https://www.pfriembeer.com/beer/all/']
  match: '^(https://www\.pfriembeer\.com)?/beer/[a-z0-9-]+/$'
  base: https://www.pfriembeer.com

# Kings & Daughters (Hood River) publishes no hop lists on its own shop
# pages; data/beers/kings-and-daughters.yml is keyed by hand from the
# brewery's own descriptions on its Untappd page, and only for beers whose
# description names the hops.

- slug: ex-novo
  name: Ex Novo Brewing
  city: Portland
  state: OR
  url: https://exnovobrew.com/
  sitemaps: ['https://exnovobrew.com/sitemap.xml']
  match: '^https://exnovobrew\.com/beer/[a-z0-9-]+/$'

- slug: breakside
  name: Breakside Brewery
  city: Portland
  state: OR
  url: https://breakside.com/
  sitemaps: ['https://breakside.com/our_beer-sitemap.xml']
  match: '^https://breakside\.com/our_beer/[a-z0-9-]+/$'

- slug: ecliptic
  name: Ecliptic Brewing
  city: Portland
  state: OR
  url: https://eclipticbrewing.com/
  sitemaps: ['https://eclipticbrewing.com/wp-sitemap-posts-beer-1.xml']
  match: '^https://eclipticbrewing\.com/beer/[a-z0-9-]+/$'

- slug: 7-seas
  name: 7 Seas Brewing
  city: Tacoma
  state: WA
  url: https://www.7seasbrewing.com/
  listing: ['https://www.7seasbrewing.com/beers/', 'https://www.7seasbrewing.com/beer-releases/']
  match: '^https://www\.7seasbrewing\.com/(beers/[a-z0-9-]+/|[0-9]{4}-[a-z0-9-]*fresh-hop[a-z0-9-]*/|uno-mas-is-back/)$'

# --- Seattle and around ---

- slug: elysian
  name: Elysian Brewing
  city: Seattle
  state: WA
  url: https://www.elysianbrewing.com/
  sitemaps: ['https://www.elysianbrewing.com/sitemap.xml']
  match: '^https://www\.elysianbrewing\.com/beer/[a-z0-9-]+$'

- slug: fair-isle
  name: Fair Isle Brewing
  city: Seattle
  state: WA
  url: https://fairislebrewing.com/
  sitemaps: ['https://fairislebrewing.com/sitemap.xml']
  match: '^https://fairislebrewing\.com/beer/[a-z0-9-]+/$'

- slug: holy-mountain
  name: Holy Mountain Brewing
  city: Seattle
  state: WA
  url: https://holymountainbrewing.com/
  sitemaps: ['https://holymountainbrewing.com/sitemap.xml']
  match: '^https://holymountainbrewing\.com/beer/[a-z0-9-]+/$'

- slug: cloudburst
  name: Cloudburst Brewing
  city: Seattle
  state: WA
  url: https://cloudburstbrew.com/
  sitemaps: ['https://cloudburstbrew.com/sitemap.xml']
  match: '^https://cloudburstbrew\.com/beer/[a-z0-9-]*[a-z](-[0-9])?/$'
  limit: 450

- slug: reubens
  name: Reuben's Brews
  city: Seattle
  state: WA
  url: https://reubensbrews.com/
  sitemaps: ['https://reubensbrews.com/beer-sitemap.xml']
  match: '^https://reubensbrews\.com/beer/[a-z0-9-]+/$'

- slug: fremont
  name: Fremont Brewing
  city: Seattle
  state: WA
  url: https://www.fremontbrewing.com/
  listing: ['https://www.fremontbrewing.com/taplist']
  match: '^$'

- slug: aslan
  name: Aslan Brewing
  city: Bellingham
  state: WA
  url: https://www.aslanbrewing.com/
  sitemaps: ['https://www.aslanbrewing.com/sitemap.xml']
  match: '^https://www\.aslanbrewing\.com/beers/(?!category|tag)[a-z0-9-]+$'

- slug: georgetown
  name: Georgetown Brewing
  city: Seattle
  state: WA
  url: https://georgetownbeer.com/
  # A Shopify shop: every beer, current and archived, is a product page.
  listing:
    - 'https://georgetownbeer.com/pages/available-beer'
    - 'https://georgetownbeer.com/collections/beer-archive'
    - 'https://georgetownbeer.com/collections/beer-archive?page=2'
    - 'https://georgetownbeer.com/collections/beer-archive?page=3'
    - 'https://georgetownbeer.com/collections/beer-archive?page=4'
  match: '^(https://georgetownbeer\.com)?(/collections/[a-z0-9-]+)?/products/[a-z0-9-]+$'
  base: https://georgetownbeer.com
  page_url: 'https://georgetownbeer.com/{path}'

- slug: stoup
  name: Stoup Brewing
  city: Seattle
  state: WA
  url: https://www.stoupbrewing.com/
  # Each beer page is an empty shell filled by JavaScript from a JSON
  # endpoint keyed by the number at the end of its URL; that's what's saved.
  sitemaps: ['https://www.stoupbrewing.com/sitemap.xml']
  match: '^https://www\.stoupbrewing\.com/beer/[a-z0-9-]+-\d+\.html$'
  fetch: 'https://www.stoupbrewing.com/templates/sections/beeriodic-table-section-2023.dialog-beer.php?beer_id={id}'
  fetch_id: '-(\d+)\.html$'
  slug_strip: '-\d+$'
  page_url: 'https://www.stoupbrewing.com/{path}.html'

- slug: bale-breaker
  name: Bale Breaker Brewing
  city: Yakima
  state: WA
  url: https://balebreaker.com/
  listing: ['https://balebreaker.com/beers/']
  match: '^https://balebreaker\.com/beer/[a-z0-9-]+/$'
  page_url: 'https://balebreaker.com/{path}/'

- slug: structures
  name: Structures Brewing
  city: Bellingham
  state: WA
  url: https://www.structuresbrewing.com/
  sitemaps: ['https://www.structuresbrewing.com/sitemap.xml']
  match: '^https://www\.structuresbrewing\.com/(?!(?:old-town|state-street|ourbeer|events-1|shop|about|cart|locations|find-our-beer|contact|home-1)$)[a-z0-9-]+$'
  page_url: 'https://www.structuresbrewing.com/{path}'

- slug: block-15
  name: Block 15 Brewing
  city: Corvallis
  state: OR
  url: https://www.block15.com/
  # Pages drawn by JavaScript: the series pages are rendered and every beer
  # page they link to is rendered and saved.
  render_listing: true
  listing:
    - 'https://www.block15.com/beer'
    - 'https://block15.com/year-round-beers'
    - 'https://block15.com/seasonal-beers'
    - 'https://block15.com/specialty-beers'
    - 'https://block15.com/exploratory-beers'
    - 'https://block15.com/collaboration-beers'
    - 'https://block15.com/cellar-aged-beers'
    - 'https://block15.com/lagered-by-the-sun'
  page_url: 'https://block15.com/{path}'
  match: '^https://(www\.)?block15\.com/(?!(?:order|shop|cart|account|contact|visit|events|jobs|about|beer|privacy|terms|search|blog|news|locations|restaurant|menu|pub|brewery|careers|faq|newsletter|gift)(?:[/-]|$))[a-z0-9-]+/?$'

- slug: pelican
  name: Pelican Brewing
  city: Pacific City
  state: OR
  url: https://pelicanbrewing.com/
  listing: ['https://pelicanbrewing.com/beer/']
  # Not the hop waters (Sparkle Hops): they're not beer.
  match: '^https://pelicanbrewing\.com/beer/(?!sparkle|[a-z]+-plus-)[a-z0-9-]+/$'

- slug: great-notion
  name: Great Notion Brewing
  city: Portland
  state: OR
  url: https://greatnotion.com/
  # A Shopify shop; hops are named in the product description.
  listing:
    - 'https://greatnotion.com/collections/all-ipa-products'
    - 'https://greatnotion.com/collections/all-lager-products'
    - 'https://greatnotion.com/collections/all-special-products'
    - 'https://greatnotion.com/collections/all-sour-products'
  match: '^(https://greatnotion\.com)?/products/[a-z0-9_-]+$'
  base: https://greatnotion.com
  page_url: 'https://greatnotion.com/{path}'
