# --- Charles Faram (UK merchant) hop oracle: spec tables only, never the prose ---
# Several of its cells are garbled (dates and stray digits); the parser's ceilings
# drop the impossible ones and the rest are excluded below by name.
- slug: pekko
  source: charles-faram
  file: charlesfaram.com/hop-oracle_pekko-hop.html
  url: https://charlesfaram.com/hop-oracle/pekko-hop/
  exclude:
    total_oil: 20.1-20.7 mL/100g is ten times any hop on record
- slug: jarrylo
  source: charles-faram
  file: charlesfaram.com/hop-oracle_jarrylo.html
  url: https://charlesfaram.com/hop-oracle/jarrylo/
- slug: idaho-gem
  source: charles-faram
  file: charlesfaram.com/hop-oracle_idaho-gem-hop.html
  url: https://charlesfaram.com/hop-oracle/idaho-gem-hop/
- slug: triumph
  source: charles-faram
  file: charlesfaram.com/hop-oracle_triumph.html
  url: https://charlesfaram.com/hop-oracle/triumph/
- slug: vista
  source: charles-faram
  file: charlesfaram.com/hop-oracle_vista.html
  url: https://charlesfaram.com/hop-oracle/vista/
  exclude:
    myrcene: 0.05% myrcene is not credible for an aroma hop; a garbled cell
- slug: zappa
