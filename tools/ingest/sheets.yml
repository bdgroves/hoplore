# --- Breeders and owners ---
- slug: elani
  source: yqh
  file: yakhops.com/elani.html
  url: https://yakhops.com/elani/

- slug: zappa
  source: cls-farms
  file: neomexicanus.com/wp-content_uploads_2024_10_Zappa-Hops_2022-Fact-Sheet_final_web-1.pdf
  url: https://neomexicanus.com/wp-content/uploads/2024/10/Zappa-Hops_2022-Fact-Sheet_final_web-1.pdf
  note: 2022 fact sheet; the oil figures are single analyses, not ranges.
  values:
    alpha_acid: [6, 8]
    beta_acid: [8, 9]
    total_oil: [1.8, 2.5]
    myrcene: 64.37
    humulene: 4.62
    caryophyllene: 8.55
    linalool: 0.82
    geraniol: 0.67

- slug: idaho-gem
  source: john-i-haas
  file: johnihaas.com/wp-content_uploads_2020_09_Haas_HopSpecSheets-IdahoGem_110520.pdf
  url: https://www.johnihaas.com/wp-content/uploads/2020/09/Haas_HopSpecSheets-IdahoGem_110520.pdf
  note: 2020 spec sheet; the oil figures are single analyses, not ranges.
  # Caryophyllene is printed as 0.03% -- left out; every other source has it in whole percents.
  values:
    alpha_acid: [11, 14]
    beta_acid: [5, 7]
    cohumulone: [40, 45]
    total_oil: [1.3, 2.0]
    myrcene: 61.32
    humulene: 17.66

