name: Snapshot a source catalog

# Manual only. Crawls a source's full catalog on a GitHub runner and commits
# the list to tools/ingest/catalogs/, so what the source publishes is on
# record in the repo (and diffable over time). Writes nothing to data/hops/.

on:
  workflow_dispatch:
    inputs:
      source:
        description: Which source
        type: choice
        options: [hopsteiner, barthhaas, hbc, usda_nass, snapshot, breweries]
        default: hopsteiner

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: data
          cache: true

      - name: Crawl
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          set -o pipefail
          if [ "$SOURCE" = breweries ]; then
            pixi run -e data python tools/ingest/snapshot.py --breweries | tee -a "$GITHUB_STEP_SUMMARY"
            if [ -s tools/ingest/raw/pages/render_urls.txt ]; then
              npm i --no-save playwright-core@1.56.0 >/dev/null
              node tools/ingest/render.mjs | tail -40 | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          if [ "$SOURCE" = snapshot ]; then
            pixi run -e data python tools/ingest/snapshot.py | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          if [ "$SOURCE" = usda_nass ]; then
            pixi run -e data python tools/ingest/usda_nass.py --fetch | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          EXTRA=""; [ "$SOURCE" = barthhaas ] && EXTRA="--fixture cascade"
          pixi run -e data python "tools/ingest/$SOURCE.py" --catalog --delay 1.5 $EXTRA
          python3 -c "import json,sys; d=json.load(open(f'tools/ingest/catalogs/{sys.argv[1]}.json')); print(d['count'], 'varieties'); [print(' ', k, '-', v) for k, v in d['varieties'].items()]" "$SOURCE" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          if git diff --quiet -- tools/ingest/catalogs tools/ingest/fixtures tools/ingest/raw && [ -z "$(git ls-files --others --exclude-standard tools/ingest/catalogs tools/ingest/fixtures tools/ingest/raw)" ]; then
            echo "Catalog unchanged." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/ingest/catalogs tools/ingest/fixtures tools/ingest/raw
          git commit -m "Catalog snapshot: $SOURCE" -m "Written by the 'Snapshot a source catalog' workflow, run ${{ github.run_id }}."
          git push
