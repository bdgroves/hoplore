name: Run a scraper

# Manual only. Runs one ingest scraper with --apply on a GitHub runner,
# validates, and commits whatever it wrote to data/hops/. Same contract as
# running it locally: the scraper writes observations and nothing else, and
# `pixi run validate` gates the commit -- bad data never reaches main.
#
# Trigger from the Actions tab ("Run workflow"), or the API. Exists because
# some environments (sandboxes, locked-down networks) can't reach the source
# sites but GitHub's runners can.

on:
  workflow_dispatch:
    inputs:
      scraper:
        description: Which scraper
        type: choice
        options: [ych, hopsteiner, barthhaas, hbc]
        default: ych
      slugs:
        description: Space-separated HopLore slugs, or --all
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: data default
          cache: true

      - name: Scrape
        env:
          SCRAPER: ${{ inputs.scraper }}
          SLUGS: ${{ inputs.slugs }}
        run: |
          # Only slug characters and the --all flag get through to the command.
          if ! [[ "$SLUGS" =~ ^(--all|[a-z0-9-]+( [a-z0-9-]+)*)$ ]]; then
            echo "::error::slugs must be lowercase slugs separated by spaces, or --all"; exit 1
          fi
          pixi run -e data "$SCRAPER" $SLUGS --apply | tee scrape.log
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat scrape.log >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Validate
        run: pixi run validate

      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
          SCRAPER: ${{ inputs.scraper }}
          SLUGS: ${{ inputs.slugs }}
        run: |
          if git diff --quiet -- data/hops; then
            echo "Nothing written." >> "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hops
          git commit -m "Ingest: $SCRAPER $SLUGS" -m "Written by the 'Run a scraper' workflow, run ${{ github.run_id }}."
          git push
          # Pushes made with GITHUB_TOKEN don't trigger other workflows, so
          # kick the deploy explicitly or the site won't pick up the new data.
          gh workflow run deploy.yml --ref main
