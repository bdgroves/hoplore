name: Add a scanned beer

# The /scan/ page opens an issue holding a beer as YAML. This adds it to
# data/beers/scanned/ (and its rating, if it was rated, to data/ratings.yml),
# validates, commits, redeploys and closes the issue. The "Rate it" button on
# a beer page opens a rating issue, handled by the second job the same way.
# Only issues opened by the repository owner are acted on; anyone else's
# issue is left for a human to look at.

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  add:
    if: contains(github.event.issue.body, 'hoplove-beer-scan') && github.event.issue.user.login == github.repository_owner && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: data default
          cache: true

      - name: Add the beer
        id: add
        env:
          SCAN_BODY: ${{ github.event.issue.body }}
        run: |
          set -o pipefail
          pixi run -e data python tools/ingest/scanned_beer.py | tee scan.log

      - name: Validate
        run: pixi run validate

      - name: Commit, deploy, close
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          PAGE: ${{ steps.add.outputs.page }}
          SUMMARY: ${{ steps.add.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/beers/scanned
          if [ -f data/ratings.yml ]; then git add data/ratings.yml; fi
          # A beer that was already on HopLove, scanned without a rating, changes nothing.
          if ! git diff --cached --quiet; then
            git commit -m "Scanned beer: $SUMMARY" -m "From issue #$NUMBER."
            git pull --rebase --autostash && git push
            gh workflow run deploy.yml --ref main
          fi
          gh issue close "$NUMBER" --comment "$SUMMARY. It's at https://brooksgroves.com/hoplove/$PAGE (give it a minute or two if it's new). 🍺❤️"

      - name: Say what went wrong
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          why=$(tail -1 scan.log 2>/dev/null || true)
          gh issue comment "$NUMBER" --body "Couldn't add this one yet: ${why:-the check failed (see the Actions run)}. Edit the issue to fix the YAML and saving the edit tries again."

  rate:
    if: contains(github.event.issue.body, 'hoplove-rating') && github.event.issue.user.login == github.repository_owner && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: data default
          cache: true

      - name: Add the rating
        id: add
        env:
          RATING_BODY: ${{ github.event.issue.body }}
        run: |
          set -o pipefail
          pixi run -e data python tools/ingest/rating.py | tee scan.log

      - name: Validate
        run: pixi run validate

      - name: Commit, deploy, close
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          PAGE: ${{ steps.add.outputs.page }}
          SUMMARY: ${{ steps.add.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ratings.yml
          git commit -m "Rated: $SUMMARY" -m "From issue #$NUMBER."
          git pull --rebase --autostash && git push
          gh workflow run deploy.yml --ref main
          gh issue close "$NUMBER" --comment "Rated $SUMMARY. It'll show on https://brooksgroves.com/hoplove/$PAGE in a minute or two. 🍺❤️"

      - name: Say what went wrong
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          why=$(tail -1 scan.log 2>/dev/null || true)
          gh issue comment "$NUMBER" --body "Couldn't add this one yet: ${why:-the check failed (see the Actions run)}. Edit the issue to fix the YAML and saving the edit tries again."

  edit:
    if: contains(github.event.issue.body, 'hoplove-beer-edit') && github.event.issue.user.login == github.repository_owner && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: data default
          cache: true

      - name: Apply the edit
        id: add
        env:
          EDIT_BODY: ${{ github.event.issue.body }}
        run: |
          set -o pipefail
          pixi run -e data python tools/ingest/edit_beer.py | tee scan.log

      - name: Validate
        run: pixi run validate

      - name: Commit, deploy, close
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          PAGE: ${{ steps.add.outputs.page }}
          SUMMARY: ${{ steps.add.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/beers/overrides.yml
          git commit -m "Edited: $SUMMARY" -m "From issue #$NUMBER."
          git pull --rebase --autostash && git push
          gh workflow run deploy.yml --ref main
          gh issue close "$NUMBER" --comment "Edited $SUMMARY. It'll show on https://brooksgroves.com/hoplove/$PAGE in a minute or two. 🍺❤️"

      - name: Say what went wrong
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          why=$(tail -1 scan.log 2>/dev/null || true)
          gh issue comment "$NUMBER" --body "Couldn't apply this edit: ${why:-the check failed (see the Actions run)}. Edit the issue to fix the YAML and saving the edit tries again."
