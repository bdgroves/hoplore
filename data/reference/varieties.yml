# Known hop cultivars worth having a HopLore record for, whether or not we
# have gotten to them yet. This is a checklist for `pixi run coverage`, not a
# taxonomy anything else depends on — it is deliberately not schema-enforced
# and not wired into validate.js or build.js.
#
# Not exhaustive. The farm-bred long tail especially (Jackson Farms, Gooding
# Farms, CLS Farms, Virgil Gamache, Indie Hops/OSU) has no central registry —
# see HANDOFF.md. Add to this file as new releases turn up; that is exactly
# what the discovery workflow is for.
#
# slug must match what the hop's own file would be named: data/hops/<slug>.yml

- { slug: aramis, name: Aramis, country: FR }
- { slug: cascade, name: Cascade, country: US }
- { slug: centennial, name: Centennial, country: US }
- { slug: challenger, name: Challenger, country: GB }
- { slug: citra, name: Citra, country: US }
- { slug: hallertau-mittelfrueh, name: Hallertau Mittelfrüh, country: DE }
- { slug: idaho-7, name: Idaho 7, country: US }
- { slug: mosaic, name: Mosaic, country: US }
- { slug: nelson-sauvin, name: Nelson Sauvin, country: NZ }
- { slug: saaz-cz, name: Saaz, country: CZ }
- { slug: simcoe, name: Simcoe, country: US }
- { slug: strisselspalt, name: Strisselspalt, country: FR }
- { slug: whitbread-golding-variety, name: Whitbread Golding Variety, country: GB }
- { slug: willamette, name: Willamette, country: US }

