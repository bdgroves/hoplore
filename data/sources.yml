# The source registry. Every number in data/hops/ cites a key from this file.
# If you add an observation, add its source here first.
#
# tier drives trust: breeder > lab > literature > merchant > aggregator > unsourced
# weight is used by scripts/lib/rollup.js when sources disagree.

hops-france:
  publisher: Hops France (COMPTOIR AGRICOLE)
  title: Aramis variety data sheet
  url: https://www.hops-france.com/en/our-varieties/
  tier: breeder
  weight: 1.0

hopsteiner:
  publisher: Hopsteiner
  title: Hop variety data sheets
  url: https://hopsteiner.us/variety-data-sheets/
  tier: breeder
  weight: 1.0

ychr:
  publisher: Yakima Chief Ranches
  title: Proprietary variety specifications
  url: https://yakimachiefranches.com/create/brands/
  tier: breeder
  weight: 1.0
  note: >
    Publishes its methodology, which most sources do not: ranges derived from
    multiple crop years of their own laboratory data under ASBC hop methods,
    sensory from Check All That Apply ballots.

mill95:
  publisher: Mill 95
  title: Idaho hop variety profiles
  url: https://mill95hops.com/
  tier: merchant
  weight: 0.7
  note: Idaho's independent in-state hop processor; closest thing to a source of record for Idaho farm-bred varieties.

nzhops:
  publisher: New Zealand Hops Ltd
  title: NZ Hops variety pages
  url: https://nzhops.co.nz/collections/new-zealand-hops
  retrieved: '2026-09-27'
  tier: breeder
  weight: 1.0

barthhaas:
  publisher: BarthHaas
  title: Variety data sheets
  url: https://www.barthhaas.com/hops-and-products/hop-varieties-overview
  tier: breeder
  weight: 1.0

hbc:
  publisher: Hop Breeding Company
  title: HBC brand specifications
  url: https://www.hopbreeding.com/
  tier: breeder
  weight: 1.0
  note: >
    Yakima breeding joint venture of Yakima Chief Ranches and John I. Haas;
    the breeder of record for Citra, Mosaic, Sabro, Talus and the rest.

indiehops:
  publisher: Indie Hops
  title: Indie Hops variety pages (their own releases)
  url: https://indiehops.com/ih-varieties
  retrieved: '2026-09-27'
  tier: breeder
  weight: 1.0
  note: >
    Portland, Oregon. Breeds with Oregon State University (the Indie Hops
    Flavor Project); Strata, Audacia, Lórien, Luminosa and Meridian are theirs.

indiehops-oregon:
  publisher: Indie Hops
  title: Indie Hops variety pages (Oregon-grown public varieties)
  url: https://indiehops.com/ih-varieties
  retrieved: '2026-09-27'
  tier: merchant
  weight: 0.8
  note: >
    The same site's figures for public varieties it buys from Oregon growers --
    a merchant spec, and useful as the Oregon-grown view of hops most sources
    describe from Washington. Liberty and US Tettnanger sheets are copied
    templates and are excluded; see tools/ingest/sheets.yml.

charles-faram:
  publisher: Charles Faram
  title: Hop Oracle
  url: https://charlesfaram.com/hop-oracle/
  retrieved: '2026-09-27'
  tier: merchant
  weight: 0.6
  note: >
    UK merchant. Only the spec tables are used, never the prose, and several
    garbled cells are excluded by name in tools/ingest/sheets.yml.

john-i-haas:
  publisher: John I. Haas
  title: Hop spec sheets
  url: https://www.johnihaas.com/
  retrieved: '2026-09-27'
  tier: merchant
  weight: 0.8
  note: Yakima, Washington. Co-owner of the Hop Breeding Company.

yqh:
  publisher: Yakima Quality Hops
  title: Elani variety page
  url: https://yakhops.com/elani/
  retrieved: '2026-09-27'
  tier: breeder
  weight: 1.0

cls-farms:
  publisher: CLS Farms
  title: Zappa fact sheet (2022)
  url: https://neomexicanus.com/
  retrieved: '2026-09-27'
  tier: breeder
  weight: 1.0
  note: Moxee, Washington. Also the source of El Dorado.

crosby:
  publisher: Crosby Hop Farm
  title: Hop variety pages
  url: https://www.crosbyhops.com/hops/varieties
  retrieved: '2026-09-27'
  tier: merchant
  weight: 0.7
  note: >
    Family hop farm in Woodburn, Oregon (since 1900). Figures are the first
    Brewing Values block on each page (T-90 pellets); "up to" figures are
    ceilings and are skipped.

yvh:
  publisher: Yakima Valley Hops
  title: Retail hop listings
  url: https://yakimavalleyhops.com/collections/hops
  tier: merchant
  weight: 0.6

bsg:
  publisher: BSG HandCraft
  title: Hop variety reference
  url: https://bsgcraftbrewing.com/hops
  tier: merchant
  weight: 0.6

usda-nass:
  publisher: USDA National Agricultural Statistics Service
  title: National Hop Report (annual, 2017-2025 editions)
  url: https://esmis.nal.usda.gov/publication/national-hop-report
  retrieved: '2026-09-27'
  tier: literature
  weight: 0.9
  note: >
    Acreage, yield and production by variety for Washington, Oregon and Idaho.
    Plain-text releases saved under tools/ingest/raw/usda-nass/; parsed into
    data/acreage/usda-nass.yml.

usda-nass-2022:
  publisher: USDA National Agricultural Statistics Service
  title: National Hop Report 2022
  url: https://www.nass.usda.gov/Statistics_by_Subject/result.php?sector=CROPS
  retrieved: '2022-12-01'
  tier: literature
  weight: 0.9

seed-general-knowledge:
  publisher: HopLove seed pass
  title: Values entered from general brewing knowledge, pending a primary citation
  tier: unsourced
  weight: 0.1
  note: >
    Placeholder used only during the initial seed of this repo. Any record citing
    this source is flagged unverified and will not be marked published.
    Replacing these citations with real ones is the single most useful
    contribution anyone can make. See CONTRIBUTING.md.

beermaverick:
  publisher: Beer Maverick
  title: Hop varieties database
  url: https://beermaverick.com/hops/
  tier: aggregator
  weight: 0.4
  note: >
    A compiled secondary source. Useful for cross-checking and for its honest
    admission that upstream sources contradict each other. Cited where a range
    came from their compilation rather than from a sheet we read ourselves.
