slug: wai-iti
name: Wai-iti
aliases: [HORT7709]
purpose: aroma
country: NZ
kind: cultivar

ownership:
  holder: New Zealand Plant & Food Research
  mark: trademark
  public_domain: false

pedigree:
  released: 2011
  breeder: hri-nz
  parents: { unknown: true, note: 'A triploid granddaughter of the USDA variety Liberty, per NZ Hops.' }
  refs: [nzhops]

aroma:
  summary: >
    Fresh peach and ripe apricot over squeezed lime and mixed citrus, per NZ Hops. Low alpha, a lot of oil for it, and high farnesene, so the bitterness it does give is round and clean.
  tags: [peach, apricot, lime, citrus, stone-fruit]
  refs: [nzhops]

usage:
  timing: []
  beer_styles: []

products: { cryo: false, lupomax: false }

substitutes: []

meta:
  status: draft
  verification: corroborated
  last_reviewed: '2026-09-27'
  notes: >
    NZ Hops' web page heads it at 2-3.5% alpha; its variety sheet says 2.5-3.5%, which is what's recorded.
analytics:
  alpha_acid:
    unit: percent
    observations:
      - { source: nzhops, low: 2.5, high: 3.5 }
      - { source: crosby, low: 2.0, high: 2.5 }
  beta_acid:
    unit: percent
    observations:
      - { source: nzhops, low: 4.5, high: 6.5 }
      - { source: crosby, low: 5.4, high: 5.4 }
  total_oil:
    unit: ml_per_100g
    observations:
      - { source: nzhops, low: 1.0, high: 1.5 }
      - { source: crosby, low: 0.75, high: 1.5 }
oils:
  myrcene:
    unit: percent_of_total_oil
    observations:
      - { source: nzhops, low: 20.0, high: 25.0 }
      - { source: crosby, low: 10.0, high: 15.0 }
  linalool:
    unit: percent_of_total_oil
    observations:
      - { source: nzhops, low: 0.3, high: 0.5 }
      - { source: crosby, low: 0.2, high: 0.4 }
  caryophyllene:
    unit: percent_of_total_oil
    observations:
      - { source: nzhops, low: 9.0, high: 10.0 }
      - { source: crosby, low: 9.0, high: 12.0 }
  farnesene:
    unit: percent_of_total_oil
    observations:
      - { source: nzhops, low: 12.0, high: 14.0 }
      - { source: crosby, low: 12.0, high: 15.0 }
  humulene:
    unit: percent_of_total_oil
    observations:
      - { source: nzhops, low: 25.0, high: 35.0 }
      - { source: crosby, low: 30.0, high: 35.0 }
  geraniol:
    unit: percent_of_total_oil
    observations:
      - { source: nzhops, low: 0.5, high: 1.0 }
