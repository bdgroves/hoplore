slug: willamette
name: Willamette
purpose: aroma
country: US
international_code: WIL
also_grown_in: [GB]
kind: cultivar
ownership: { mark: public, public_domain: true }
pedigree:
  released: 1976
  breeder: usda-ars
  parents: { seed: fuggle, note: A triploid Fuggle seedling selected in Oregon. }
  refs: [seed-general-knowledge]
aroma:
  summary: >
    Soft, earthy and mildly floral with a faint fruit note. The quiet American
    Fuggle — it fills out a malt-forward beer without asking for attention.
  tags: [earthy, floral, herbal, woody, spice, orchard]
  refs: [seed-general-knowledge]
analytics:
  alpha_acid:
    unit: percent
    observations:
      - { source: usda-nass-2022, typical: 5.2, crop_year: 2022, note: Crop-year average across Oregon acreage. }
      - { source: hopsteiner, low: 4.5, high: 7.0, note: Data sheet last changed 2020-01-09. }
      - { source: barthhaas, low: 3.8, high: 6.5, note: Range over the last 4 crop years. }
  beta_acid:
    unit: percent
    observations:
      - { source: hopsteiner, low: 3.0, high: 4.0, note: Data sheet last changed 2020-01-09. }
      - { source: barthhaas, low: 3.0, high: 4.5, note: Range over the last 4 crop years. }
  cohumulone:
    unit: percent_of_alpha
    observations:
      - { source: hopsteiner, low: 30.0, high: 35.0, note: Data sheet last changed 2020-01-09. }
  total_oil:
    unit: ml_per_100g
    observations:
      - { source: hopsteiner, low: 1.0, high: 1.5, note: Data sheet last changed 2020-01-09. }
oils:
  myrcene:
    unit: percent_of_total_oil
    observations: [{ source: seed-general-knowledge, low: 30, high: 40 }, { source: barthhaas, low: 16.9, high: 32.0, note: Range over the last 4 crop years. }]
  humulene:
    unit: percent_of_total_oil
    observations: [{ source: seed-general-knowledge, low: 20, high: 30 }, { source: barthhaas, low: 20.6, high: 35.0, note: Range over the last 4 crop years. }]
  caryophyllene:
    unit: percent_of_total_oil
    observations: [{ source: seed-general-knowledge, low: 7, high: 8 }, { source: barthhaas, low: 8.2, high: 14.0, note: Range over the last 4 crop years. }]
  farnesene:
    unit: percent_of_total_oil
    observations: [{ source: hopsteiner, low: 5.0, high: 6.0, note: Data sheet last changed 2020-01-09. }, { source: barthhaas, low: 5.5, high: 10.0, note: Range over the last 4 crop years. }]
  other:
    unit: percent_of_total_oil
    observations: [{ source: seed-general-knowledge, low: 20, high: 30 }]
  linalool:
    unit: percent_of_total_oil
    observations:
      - { source: hopsteiner, low: 0.4, high: 0.6, note: Data sheet last changed 2020-01-09. }
  geraniol:
    unit: percent_of_total_oil
    observations:
      - { source: barthhaas, low: 0.1, high: 0.3, note: Range over the last 4 crop years. }
usage:
  timing: [late-boil, whirlpool, dry-hop]
  beer_styles: [american-pale-ale, american-amber, porter, british-brown, english-bitter, american-lager]
products: { cryo: false, lupomax: false }
substitutes:
  - { slug: strisselspalt, confidence: medium }
  - { slug: challenger, confidence: low }
  - { slug: aramis, confidence: low }
meta:
  status: draft
  verification: corroborated
  last_reviewed: '2026-09-27'
