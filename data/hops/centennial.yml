slug: centennial
name: Centennial
aliases: [CFJ90, Super Cascade]
purpose: dual
country: US
international_code: CEN
kind: cultivar
ownership: { mark: public, public_domain: true }
pedigree:
  year_crossed: 1974
  released: 1990
  breeder: usda-ars
  parents: { seed: brewers-gold, note: Brewer's Gold crossed with a complex male line. }
  refs: [seed-general-knowledge]
aroma:
  summary: >
    Cascade with the contrast turned up — sharper citrus, more lemon-pith
    bitterness, a floral top note. Bitters clean enough to carry a whole beer
    on its own.
  tags: [citrus, grapefruit, lemon, floral, pine, resinous]
  refs: [seed-general-knowledge]
analytics:
  alpha_acid:
    unit: percent
    observations:
      - { source: hopsteiner, low: 9.5, high: 11.5, note: Data sheet last changed 2020-01-09. }
      - { source: barthhaas, low: 7.8, high: 11.5, note: Range over the last 4 crop years. }
  beta_acid:
    unit: percent
    observations: [{ source: hopsteiner, low: 3.5, high: 4.5, note: Data sheet last changed 2020-01-09. }, { source: barthhaas, low: 3.3, high: 4.5, note: Range over the last 4 crop years. }]
  cohumulone:
    unit: percent_of_alpha
    observations: [{ source: hopsteiner, low: 29.0, high: 30.0, note: Data sheet last changed 2020-01-09. }]
  total_oil:
    unit: ml_per_100g
    observations: [{ source: hopsteiner, low: 0.8, high: 2.3, note: Data sheet last changed 2020-01-09. }, { source: barthhaas, low: 1.6, high: 2.5, note: Range over the last 4 crop years. }]
oils:
  myrcene:
    unit: percent_of_total_oil
    observations: [{ source: seed-general-knowledge, low: 45, high: 60 }, { source: barthhaas, low: 30.7, high: 65.7, note: Range over the last 4 crop years. }]
  humulene:
    unit: percent_of_total_oil
    observations: [{ source: seed-general-knowledge, low: 10, high: 18 }, { source: barthhaas, low: 7.5, high: 16.4, note: Range over the last 4 crop years. }]
  caryophyllene:
    unit: percent_of_total_oil
    observations: [{ source: seed-general-knowledge, low: 4, high: 8 }]
  farnesene:
    unit: percent_of_total_oil
    observations: [{ source: hopsteiner, low: 0.0, high: 1.0, note: Data sheet last changed 2020-01-09. }]
  other:
    unit: percent_of_total_oil
    observations: [{ source: seed-general-knowledge, low: 18, high: 30 }]
  linalool:
    unit: percent_of_total_oil
    observations:
      - { source: hopsteiner, low: 1.0, high: 1.3, note: Data sheet last changed 2020-01-09. }
  geraniol:
    unit: percent_of_total_oil
    observations:
      - { source: barthhaas, low: 0.3, high: 1.5, note: Range over the last 4 crop years. }
usage:
  timing: [bittering, late-boil, whirlpool, dry-hop]
  beer_styles: [american-ipa, west-coast-ipa, double-ipa, american-pale-ale, american-amber, american-stout, barleywine]
products: { cryo: true, lupomax: false }
substitutes:
  - { slug: cascade, confidence: high }
  - { slug: simcoe, confidence: medium }
  - { slug: citra, confidence: low }
meta:
  status: draft
  verification: corroborated
  last_reviewed: '2026-09-27'
