slug: challenger
name: Challenger
purpose: dual
country: GB
kind: cultivar
ownership: { mark: public, public_domain: true }
pedigree:
  released: 1972
  breeder: wye
  parents: { seed: northern-brewer-gb, note: Northern Brewer crossed with a German male; seed parent slug not yet in dataset. }
  refs: [seed-general-knowledge]
aroma:
  summary: >
    Crisp and green-spicy with cedar and a dry floral edge. Bitters cleanly,
    which is why it shows up as both the copper addition and the late charge in
    a lot of English recipes.
  tags: [spice, cedar, floral, green, tea, earthy]
  refs: [seed-general-knowledge]
