slug: strata
name: Strata
purpose: dual
country: US
kind: cultivar

# Figures from Indie Hops, which bred it; run tools/ingest/sheets.py to refresh.

ownership:
  holder: Indie Hops
  mark: registered
  public_domain: false

pedigree:
  year_crossed: 2009
  released: 2018
  breeder: indie-hops
  parents: { seed: perle, note: An open-pollinated Perle at an Oregon State University field in Corvallis. }
  refs: [indiehops]

aroma:
  summary: >
    Passionfruit and strawberry tied together with sticky, cannabis-smoke dank
    and a grapefruit edge, per Indie Hops. Oregon's answer to the Yakima
    proprietaries, and one of the few hops brewers talk about as a house flavor.
  tags: [passionfruit, strawberry, grapefruit, cannabis, dank]
  refs: [indiehops]

usage:
  timing: []
  beer_styles: []

products: { cryo: false, lupomax: false }

substitutes: []

meta:
  status: draft
  verification: corroborated
  last_reviewed: '2026-09-27'
  notes: >
    purpose defaulted to dual, unconfirmed. Pedigree, release and figures
    are from Indie Hops, which bred it with Oregon State University.
analytics:
  alpha_acid:
    unit: percent
    observations:
      - { source: indiehops, low: 12.0, high: 15.0 }
      - { source: crosby, low: 12.0, high: 15.0 }
  beta_acid:
    unit: percent
    observations:
      - { source: indiehops, low: 5.0, high: 6.0 }
      - { source: crosby, low: 5.0, high: 6.0 }
  cohumulone:
    unit: percent_of_alpha
    observations:
      - { source: indiehops, low: 21.0, high: 21.0 }
      - { source: crosby, low: 21.0, high: 21.0 }
  total_oil:
